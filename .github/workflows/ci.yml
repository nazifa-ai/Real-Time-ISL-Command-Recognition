name: CI

# Runs on every push/PR.  The heavy artefacts (INCLUDE keypoints, trained models)
# are NOT in the repository, so CI verifies the things that must hold without them:
#   * every module imports and every file compiles
#   * the configuration layer is self-consistent
#   * the pytest suite passes (data/model-dependent tests skip with a reason)
#   * the Docker image builds
# CI does not claim the project is "deployed" anywhere.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest + static checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show configuration
        run: python run.py info

      - name: Compile every Python file
        run: python -m compileall -q config.py run.py training backend frontend tests scripts

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib
          mods = ["config", "backend.preprocessing.include50", "backend.preprocessing.landmarks",
                  "backend.preprocessing.sequence", "backend.preprocessing.geometry",
                  "backend.preprocessing.mediapipe_extractor", "training.models",
                  "training.preprocess", "training.train_common", "training.evaluate_models",
                  "training.robustness", "backend.inference.predictor", "backend.inference.frames",
                  "backend.inference.audio", "backend.inference.audit", "backend.schemas",
                  "backend.personalization"]
          for m in mods:
              importlib.import_module(m)
              print("imported", m)
          PY

      - name: Run the test suite
        run: python -m pytest tests -v --maxfail=1
        env:
          ISL_PERSIST_UPLOADS: "false"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t isl-recognition:ci .
      - name: Import check inside the image
        run: docker run --rm isl-recognition:ci python -c "import backend.main, backend.inference.realtime; print('image imports ok')"
